spring.application.name=erp
server.address=127.0.0.1
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/erp}
spring.datasource.username=${DB_USER:erp}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.name=ERPSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
erp.bootstrap.admin-password=${ERP_ADMIN_PASSWORD:}
